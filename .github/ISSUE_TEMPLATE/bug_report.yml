name: Bug report
description: Report a defect or API limitation found by the framework
title: '[BUG]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Please include enough detail to reproduce it.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Local, CI, Restful Booker URL, Fake REST API URL
      placeholder: CI / https://restful-booker.herokuapp.com
    validations:
      required: true
  - type: textarea
    id: preconditions
    attributes:
      label: Preconditions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - Major
        - Minor
        - Trivial
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, Allure attachments, response snippets (sanitize secrets)
